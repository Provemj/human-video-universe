<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Video Universe - Evolution Survey</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050810; color: #e2e8f0; margin: 0; overflow-x: hidden; }
        .timeline-container { 
            position: relative; 
            background: radial-gradient(circle at top, #111827 0%, #050810 80%); 
            border-radius: 3rem; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 2rem;
            width: 100%;
            overflow: visible;
        }
        .year-marker { 
            position: absolute; 
            left: 30px; 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 16px; 
            font-weight: 800; 
            color: #4f46e5; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            width: 150px;
            z-index: 10;
        }
        .year-marker::after { content: ''; flex-grow: 1; height: 1px; background: linear-gradient(to right, #4f46e5, transparent); }
        .branch-path { fill: none; stroke-width: 3; stroke-linecap: round; opacity: 0.15; transition: all 0.3s ease; }
        .branch-path:hover { opacity: 0.4; stroke-width: 5; }
        .convergence-line { fill: none; stroke-width: 1.5; stroke-dasharray: 6 4; opacity: 0.4; stroke: #6366f1; }
        .node-point { width: 14px; height: 14px; border-radius: 50%; border: 3px solid #050810; position: absolute; transform: translate(-50%, -50%); z-index: 50; cursor: pointer; transition: all 0.3s; }
        .node-point:hover { transform: translate(-50%, -50%) scale(2.2); box-shadow: 0 0 30px currentColor; }
        .node-label { 
            position: absolute; 
            white-space: nowrap; 
            font-size: 11px; 
            font-weight: 700; 
            color: #fff; 
            background: rgba(15, 23, 42, 0.9); 
            padding: 4px 12px; 
            border-radius: 8px; 
            opacity: 0; 
            transform: translate(15px, -50%); 
            transition: all 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: none;
        }
        .node-group:hover .node-label { opacity: 1; transform: translate(20px, -50%); }
        .category-header { 
            position: absolute; 
            text-align: center; 
            font-weight: 900; 
            font-size: 12px; 
            text-transform: uppercase; 
            padding: 10px 20px; 
            border-radius: 99px; 
            background: rgba(30, 41, 59, 0.8); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 60;
        }
        #app { transition: opacity 0.5s ease; }
    </style>
</head>
<body>

<div id="app" class="max-w-[1600px] mx-auto p-6 md:p-12 opacity-100">
    <header class="mb-16 flex flex-col lg:flex-row justify-between items-start lg:items-end gap-10">
        <div>
            <h1 class="text-6xl font-black text-white tracking-tighter mb-4 italic">Human Video <span class="text-indigo-500">Universe</span></h1>
            <p class="text-slate-400 max-w-2xl text-lg leading-relaxed border-l-4 border-indigo-500 pl-6">
                Interactive Evolutionary Tree: Mapping the progression of digital human motion generation.
            </p>
        </div>
        <div class="bg-slate-900/50 p-3 rounded-3xl border border-white/5 flex flex-wrap gap-2">
            <button onclick="updateGroupBy('mod')" id="btn-mod" class="px-8 py-3 rounded-2xl text-xs font-black uppercase transition-all">Modality</button>
            <button onclick="updateGroupBy('task')" id="btn-task" class="px-8 py-3 rounded-2xl text-xs font-black uppercase transition-all">Task</button>
            <button onclick="updateGroupBy('base')" id="btn-base" class="px-8 py-3 rounded-2xl text-xs font-black uppercase transition-all">Architecture</button>
        </div>
    </header>

    <div class="timeline-container" id="main-container">
        <div class="absolute top-10 left-1/2 -translate-x-1/2 flex flex-col items-center z-50">
            <div class="w-8 h-8 bg-white rounded-full shadow-[0_0_40px_#6366f1] ring-8 ring-indigo-500/10"></div>
            <span class="text-[10px] font-black text-white mt-4 uppercase tracking-[0.4em]">Foundation Models</span>
        </div>
        <svg id="tree-svg" class="absolute inset-0 w-full h-full pointer-events-none"></svg>
        <div id="timeline-marks" class="absolute inset-0 pointer-events-none"></div>
        <div id="nodes-layer" class="absolute inset-0"></div>
    </div>
</div>

<div id="detail-modal" class="fixed inset-0 bg-slate-950/98 backdrop-blur-3xl hidden z-[100] flex items-center justify-center p-6">
    <div class="bg-slate-900 border border-white/10 rounded-[3rem] max-w-3xl w-full p-12 relative shadow-2xl">
        <button onclick="closeModal()" class="absolute top-10 right-10 text-slate-500 hover:text-white transition"><i data-lucide="x" class="w-10 h-10"></i></button>
        <div id="modal-content"></div>
    </div>
</div>

<script>
    const DATA = {
        "papers": [
            { "id": 1, "name": "Improving Human Image Animation", "year": 2026, "month": 5, "mod": ["Text"], "task": "Animation", "base": "DiT", "desc": "Semantic Representation Alignment.", "link": "https://arxiv.org/abs/2605.10523" },
            { "id": 2, "name": "SocialDirector", "year": 2026, "month": 5, "mod": ["Text"], "task": "General", "base": "DiT", "desc": "Training-Free Social Interaction Control.", "link": "https://arxiv.org/abs/2605.10079" },
            { "id": 3, "name": "SDTalk", "year": 2026, "month": 5, "mod": ["Audio"], "task": "Talking Head", "base": "GAN", "desc": "Structured Facial Priors.", "link": "https://arxiv.org/abs/2605.09956" },
            { "id": 4, "name": "Unison", "year": 2026, "month": 5, "mod": ["Text"], "task": "General", "base": "DiT", "desc": "Harmonizing Motion, Speech, and Sound.", "link": "https://arxiv.org/abs/2605.08729" },
            { "id": 5, "name": "MoCoTalk", "year": 2026, "month": 5, "mod": ["Audio"], "task": "Talking Head", "base": "Diffusion", "desc": "Adaptive Router.", "link": "https://arxiv.org/abs/2605.08050" },
            { "id": 6, "name": "Implicit Preference Alignment", "year": 2026, "month": 5, "mod": ["Vision"], "task": "Animation", "base": "UNet", "desc": "Pose-Guided Dance Video.", "link": "https://arxiv.org/abs/2605.07545" },
            { "id": 7, "name": "AudioFace", "year": 2026, "month": 5, "mod": ["Audio"], "task": "Talking Head", "base": "LLM", "desc": "Speech-Driven Facial Animation.", "link": "https://arxiv.org/abs/2605.07478" },
            { "id": 8, "name": "SuperFace", "year": 2026, "month": 5, "mod": ["Vision"], "task": "Talking Head", "base": "UNet", "desc": "Preference-Aligned Expression Estimation.", "link": "https://arxiv.org/abs/2605.06179" },
            { "id": 9, "name": "FaithfulFaces", "year": 2026, "month": 5, "mod": ["Text"], "task": "Talking Head", "base": "DiT", "desc": "Facial Identity Preservation.", "link": "https://arxiv.org/abs/2605.04702" },
            { "id": 10, "name": "TripVVT", "year": 2026, "month": 5, "mod": ["Vision"], "task": "Virtual Try-on", "base": "UNet", "desc": "Large-Scale Triplet Dataset.", "link": "https://arxiv.org/abs/2604.27958" },
            { "id": 11, "name": "Mutual Forcing", "year": 2026, "month": 4, "mod": ["Text"], "task": "General", "base": "Autoregressive", "desc": "Fast Autoregressive Character Gen.", "link": "https://arxiv.org/abs/2604.25819" },
            { "id": 12, "name": "Hallo-Live", "year": 2026, "month": 4, "mod": ["Text", "Audio"], "task": "Talking Head", "base": "Flow Matching", "desc": "Real-Time Streaming Avatar.", "link": "https://arxiv.org/abs/2604.23632" },
            { "id": 13, "name": "Talker-T2AV", "year": 2026, "month": 4, "mod": ["Audio"], "task": "Talking Head", "base": "Autoregressive", "desc": "Joint Talking Audio-Video.", "link": "https://arxiv.org/abs/2604.23586" },
            { "id": 14, "name": "OmniHuman", "year": 2026, "month": 4, "mod": ["Audio"], "task": "Talking Head", "base": "UNet", "desc": "Human-Centric Video Dataset.", "link": "https://arxiv.org/abs/2604.18326" },
            { "id": 15, "name": "TurboTalk", "year": 2026, "month": 4, "mod": ["Audio"], "task": "Talking Head", "base": "Flow Matching", "desc": "One-Step Audio-Driven Avatar.", "link": "https://arxiv.org/abs/2604.14580" },
            { "id": 16, "name": "HumANDiff", "year": 2026, "month": 4, "mod": ["Vision"], "task": "Animation", "base": "Diffusion", "desc": "Articulated Noise Diffusion.", "link": "https://arxiv.org/abs/2604.05961" },
            { "id": 17, "name": "AvatarForcing", "year": 2026, "month": 3, "mod": ["Audio"], "task": "Talking Head", "base": "Autoregressive", "desc": "Sliding-Window Denoising.", "link": "https://arxiv.org/abs/2603.14331" },
            { "id": 18, "name": "Kling-MotionControl", "year": 2026, "month": 3, "mod": ["Text"], "task": "General", "base": "DiT", "desc": "Technical report on motion control.", "link": "https://arxiv.org/abs/2603.03160" },
            { "id": 19, "name": "LiveTalk", "year": 2025, "month": 12, "mod": ["Audio"], "task": "Talking Head", "base": "Diffusion", "desc": "Real-time interactive video diffusion.", "link": "https://arxiv.org/abs/2512.23576" },
            { "id": 20, "name": "ByteLoom", "year": 2025, "month": 12, "mod": ["Audio"], "task": "Talking Head", "base": "Diffusion", "desc": "Consistent human-object interactions.", "link": "https://arxiv.org/abs/2512.22854" },
            { "id": 23, "name": "Knot Forcing", "year": 2025, "month": 12, "mod": ["Audio"], "task": "Talking Head", "base": "Autoregressive", "desc": "Infinite interactive portrait animation.", "link": "https://arxiv.org/abs/2512.21734" },
            { "id": 27, "name": "EchoMotion", "year": 2025, "month": 12, "mod": ["Text"], "task": "Animation", "base": "DiT", "desc": "Unified video and motion via DiT.", "link": "https://arxiv.org/abs/2512.18814" },
            { "id": 29, "name": "FlashPortrait", "year": 2025, "month": 12, "mod": ["Vision"], "task": "Talking Head", "base": "GAN", "desc": "6x faster infinite portrait animation.", "link": "https://arxiv.org/abs/2512.16900" },
            { "id": 34, "name": "UniMo", "year": 2025, "month": 12, "mod": ["Vision"], "task": "Animation", "base": "Autoregressive", "desc": "Unifying 2D video and 3D human motion.", "link": "https://arxiv.org/abs/2512.03918" },
            { "id": 39, "name": "VividAnimator", "year": 2025, "month": 10, "mod": ["Audio", "Motion"], "task": "Animation", "base": "Diffusion", "desc": "End-to-end audio and pose-driven animation.", "link": "https://arxiv.org/abs/2510.10269" }
        ],
        "categories": {
            "mod": ["Vision", "Text", "Audio", "Motion"],
            "task": ["Animation", "Talking Head", "Virtual Try-on", "3D Generation", "Interactive Edit", "Motion Planning", "General"],
            "base": ["UNet", "DiT", "GAN", "Flow Matching", "Autoregressive", "Diffusion", "LLM"]
        },
        "years": [2018, 2022, 2023, 2024, 2025, 2026]
    };

    let currentGroup = 'mod';
    let BASE_YEAR = 2018; 
    const YEAR_HEIGHT = 450; 
    const START_Y = 400;

    function init() {
        // Post-processing to handle manual additions
        DATA.papers.sort((a, b) => (a.year + a.month/13) - (b.year + b.month/13));
        
        // Setup base timeline
        const validYears = DATA.papers.map(p => parseInt(p.year)).filter(y => !isNaN(y));
        BASE_YEAR = Math.min(...validYears, ...DATA.years);
        const maxYear = Math.max(...validYears, ...DATA.years);
        const span = (maxYear - BASE_YEAR) + 1;
        document.getElementById('main-container').style.minHeight = `${START_Y + (span * YEAR_HEIGHT) + 400}px`;

        updateGroupBy('mod');
        if (window.lucide) lucide.createIcons();
        window.addEventListener('resize', () => renderTree());
    }

    function getY(year, month) {
        return START_Y + ((year - BASE_YEAR) + (month - 1) / 12) * YEAR_HEIGHT;
    }

    function updateGroupBy(v) {
        currentGroup = v;
        document.querySelectorAll('button[id^="btn-"]').forEach(b => {
            b.classList.remove('bg-indigo-600', 'text-white');
            b.classList.add('text-slate-500');
        });
        document.getElementById(`btn-${v}`).classList.add('bg-indigo-600', 'text-white');
        renderTree();
    }

    function renderTree() {
        const svg = document.getElementById('tree-svg');
        const nodesLayer = document.getElementById('nodes-layer');
        const timelineMarks = document.getElementById('timeline-marks');
        const container = document.getElementById('main-container');
        
        svg.innerHTML = ''; nodesLayer.innerHTML = ''; timelineMarks.innerHTML = '';

        const width = container.offsetWidth;
        const cats = DATA.categories[currentGroup];
        const colWidth = (width - 240) / cats.length;
        const rootX = width / 2;
        const lanePositions = cats.map((_, i) => 180 + (i * colWidth) + (colWidth / 2));

        // Draw Years
        for (let yr = BASE_YEAR; yr <= 2026; yr++) {
            const marker = document.createElement('div');
            marker.className = "year-marker";
            marker.style.top = `${getY(yr, 1)}px`;
            marker.innerHTML = `<span>${yr}</span>`;
            timelineMarks.appendChild(marker);
        }

        // Draw Trunks
        cats.forEach((cat, i) => {
            const laneX = lanePositions[i];
            const color = `hsl(${220 + (i * (360/cats.length))}, 70%, 60%)`;
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            // Root is at top center, splitting into parallel trunks
            path.setAttribute("d", `M ${rootX} 80 C ${rootX} 250, ${laneX} 150, ${laneX} 350 L ${laneX} ${container.scrollHeight}`);
            path.setAttribute("class", "branch-path");
            path.setAttribute("stroke", color);
            svg.appendChild(path);

            const header = document.createElement('div');
            header.className = "category-header";
            header.style.left = `${laneX}px`; header.style.top = `330px`;
            header.style.transform = "translateX(-50%)"; header.style.color = color;
            header.textContent = cat;
            nodesLayer.appendChild(header);
        });

        DATA.papers.forEach(p => {
            const y = getY(p.year, p.month);
            const val = p[currentGroup];
            const targetIndices = (Array.isArray(val) ? val : [val]).map(v => cats.indexOf(v)).filter(idx => idx !== -1);
            
            // Draw horizontal connector for multi-presence
            if (targetIndices.length > 1) {
                const xs = targetIndices.map(i => lanePositions[i]);
                const line = document.createElementNS("http://www.w3.org/2000/svg", "path");
                line.setAttribute("d", `M ${Math.min(...xs)} ${y} L ${Math.max(...xs)} ${y}`);
                line.setAttribute("class", "convergence-line");
                svg.appendChild(line);
            }

            // Draw individual points
            targetIndices.forEach(idx => {
                const group = document.createElement('div');
                group.className = "node-group";
                const node = document.createElement('div');
                node.className = "node-point";
                node.style.left = `${lanePositions[idx]}px`; node.style.top = `${y}px`;
                node.style.backgroundColor = `hsl(${220 + (idx * (360/cats.length))}, 70%, 60%)`;
                node.onclick = () => showDetail(p);
                const label = document.createElement('div');
                label.className = "node-label";
                label.style.left = `${lanePositions[idx]}px`; label.style.top = `${y}px`;
                label.textContent = p.name;
                group.appendChild(node); group.appendChild(label);
                nodesLayer.appendChild(group);
            });
        });
    }

    function showDetail(p) {
        document.getElementById('detail-modal').classList.remove('hidden');
        document.getElementById('modal-content').innerHTML = `
            <div class="flex items-center gap-4 mb-8">
                <span class="bg-indigo-600 text-white px-4 py-1 rounded-xl text-[10px] font-black tracking-widest">${p.year}.${p.month}</span>
                <span class="bg-slate-800 text-indigo-400 px-4 py-1 rounded-xl text-[10px] font-black uppercase tracking-widest">${p.base}</span>
                <span class="text-indigo-300 font-black uppercase text-[10px] tracking-widest ml-auto">${p.task}</span>
            </div>
            <h2 class="text-5xl font-black text-white mb-8 tracking-tighter">${p.name}</h2>
            <p class="text-xl text-slate-400 mb-12 leading-relaxed font-light">${p.desc || "Human video generation milestone."}</p>
            <div class="flex gap-4">
                <a href="${p.link}" target="_blank" class="flex-1 bg-white text-black py-5 rounded-3xl text-center font-black text-lg hover:bg-indigo-600 hover:text-white transition-all shadow-2xl">Read Paper</a>
                <button onclick="closeModal()" class="px-10 border border-slate-800 text-slate-500 py-5 rounded-3xl font-bold">Close</button>
            </div>
        `;
        if (window.lucide) lucide.createIcons();
    }
    function closeModal() { document.getElementById('detail-modal').classList.add('hidden'); }
    window.onload = init;
</script>
</body>
</html>
