<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Video Universe - Evolution Survey</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050810; color: #e2e8f0; margin: 0; }
        .timeline-container { 
            position: relative; 
            background: radial-gradient(circle at top, #111827 0%, #050810 80%); 
            border-radius: 3rem; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 2rem;
            width: 100%;
            overflow: visible;
        }
        .year-marker { 
            position: absolute; 
            left: 30px; 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 16px; 
            font-weight: 800; 
            color: #4f46e5; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            width: 150px;
            z-index: 10;
        }
        .year-marker::after { content: ''; flex-grow: 1; height: 1px; background: linear-gradient(to right, #4f46e5, transparent); }
        .branch-path { fill: none; stroke-width: 3; stroke-linecap: round; opacity: 0.1; transition: opacity 0.3s; }
        .branch-path:hover { opacity: 0.3; }
        .convergence-line { fill: none; stroke-width: 1.5; stroke-dasharray: 6 4; opacity: 0.4; stroke: #6366f1; }
        .node-point { width: 14px; height: 14px; border-radius: 50%; border: 3px solid #050810; position: absolute; transform: translate(-50%, -50%); z-index: 50; cursor: pointer; transition: all 0.3s; }
        .node-point:hover { transform: translate(-50%, -50%) scale(2); box-shadow: 0 0 30px currentColor; }
        .node-label { 
            position: absolute; 
            white-space: nowrap; 
            font-size: 11px; 
            font-weight: 700; 
            color: #fff; 
            background: rgba(15, 23, 42, 0.9); 
            padding: 4px 12px; 
            border-radius: 8px; 
            opacity: 0; 
            transform: translate(15px, -50%); 
            transition: all 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: none;
        }
        .node-group:hover .node-label { opacity: 1; transform: translate(20px, -50%); }
        .category-header { 
            position: absolute; 
            text-align: center; 
            font-weight: 900; 
            font-size: 12px; 
            text-transform: uppercase; 
            padding: 10px 20px; 
            border-radius: 99px; 
            background: rgba(30, 41, 59, 0.8); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 60;
        }
        #loading { position: fixed; inset: 0; background: #050810; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; transition: opacity 0.5s; }
        #error-display { color: #ef4444; margin-top: 1.5rem; font-size: 0.875rem; max-width: 500px; text-align: center; display: none; background: rgba(239, 68, 68, 0.1); padding: 1rem; border-radius: 1rem; border: 1px solid rgba(239, 68, 68, 0.2); }
    </style>
</head>
<body>

<div id="loading">
    <div class="w-16 h-16 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
    <span class="font-black tracking-widest uppercase text-indigo-400">Syncing Universe Data...</span>
    <div id="error-display"></div>
</div>

<div id="app" class="max-w-[1600px] mx-auto p-6 md:p-12 opacity-0 transition-opacity duration-1000">
    <header class="mb-16 flex flex-col lg:flex-row justify-between items-start lg:items-end gap-10">
        <div>
            <h1 class="text-6xl font-black text-white tracking-tighter mb-4 italic">
                Human Video <span class="text-indigo-500">Universe</span>
            </h1>
            <p class="text-slate-400 max-w-2xl text-lg leading-relaxed border-l-4 border-indigo-500 pl-6">
                Interactive Living Survey: Navigating technical evolution from 2D to 3D motion planning.
            </p>
        </div>
        <div class="bg-slate-900/50 p-3 rounded-3xl border border-white/5 flex flex-wrap gap-2">
            <button onclick="updateGroupBy('mod')" id="btn-mod" class="px-8 py-3 rounded-2xl text-xs font-black uppercase transition-all">Modality</button>
            <button onclick="updateGroupBy('task')" id="btn-task" class="px-8 py-3 rounded-2xl text-xs font-black uppercase transition-all">Task</button>
            <button onclick="updateGroupBy('base')" id="btn-base" class="px-8 py-3 rounded-2xl text-xs font-black uppercase transition-all">Architecture</button>
        </div>
    </header>

    <div class="timeline-container" id="main-container">
        <svg id="tree-svg" class="absolute inset-0 w-full h-full pointer-events-none"></svg>
        <div id="timeline-marks" class="absolute inset-0 pointer-events-none"></div>
        <div id="nodes-layer" class="absolute inset-0"></div>
    </div>
</div>

<div id="detail-modal" class="fixed inset-0 bg-slate-950/98 backdrop-blur-3xl hidden z-[100] flex items-center justify-center p-6">
    <div class="bg-slate-900 border border-white/10 rounded-[3rem] max-w-3xl w-full p-12 relative shadow-2xl">
        <button onclick="closeModal()" class="absolute top-10 right-10 text-slate-500 hover:text-white transition"><i data-lucide="x" class="w-10 h-10"></i></button>
        <div id="modal-content"></div>
    </div>
</div>

<script>
    let DATA = null;
    let currentGroup = 'mod';
    let BASE_YEAR = 2018; 
    const YEAR_HEIGHT = 500; 
    const START_Y = 400;

    async function init() {
        // 5秒强制关闭加载页，防止白屏
        const safetyTimeout = setTimeout(() => {
            if (!DATA) {
                showError("Load Timeout: Check if list.json is missing or corrupted.");
                hideLoading();
            }
        }, 5000);

        try {
            const response = await fetch('./list.json');
            if (!response.ok) throw new Error(`HTTP Error ${response.status}: Failed to reach list.json`);
            
            const raw = await response.text();
            try {
                DATA = JSON.parse(raw);
            } catch (e) {
                throw new Error(`JSON Syntax Error: ${e.message}. Check for trailing commas or missing brackets.`);
            }

            if (!DATA.papers || DATA.papers.length === 0) {
                throw new Error("Empty dataset: No papers found in JSON.");
            }

            // 数据预处理
            DATA.papers.sort((a, b) => (a.year + a.month/13) - (b.year + b.month/13));
            
            const paperYears = DATA.papers.map(p => p.year).filter(y => !isNaN(y));
            const categoryYears = DATA.years || [];
            BASE_YEAR = Math.min(...paperYears, ...categoryYears);
            const maxYear = Math.max(...paperYears, ...categoryYears);
            
            // 动态设置高度
            const span = maxYear - BASE_YEAR + 1;
            document.getElementById('main-container').style.minHeight = `${START_Y + (span * YEAR_HEIGHT) + 200}px`;

            updateGroupBy('mod');
        } catch (e) {
            console.error("Initialization Failed:", e);
            showError(e.message);
        } finally {
            clearTimeout(safetyTimeout);
            hideLoading();
            if (window.lucide) lucide.createIcons();
            window.addEventListener('resize', () => renderTree());
        }
    }

    function showError(msg) {
        const err = document.getElementById('error-display');
        err.style.display = 'block';
        err.innerHTML = `<strong>Critical Error:</strong><br>${msg}`;
    }

    function hideLoading() {
        const loader = document.getElementById('loading');
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 500);
        document.getElementById('app').classList.remove('opacity-0');
    }

    function getY(year, month) {
        const m = month || 1;
        return START_Y + ((year - BASE_YEAR) + (m - 1) / 12) * YEAR_HEIGHT;
    }

    function updateGroupBy(v) {
        currentGroup = v;
        document.querySelectorAll('button[id^="btn-"]').forEach(b => {
            b.classList.remove('bg-indigo-600', 'text-white', 'shadow-xl');
            b.classList.add('text-slate-500', 'hover:bg-slate-800');
        });
        const targetBtn = document.getElementById(`btn-${v}`);
        if (targetBtn) {
            targetBtn.classList.add('bg-indigo-600', 'text-white', 'shadow-xl shadow-indigo-500/20');
        }
        renderTree();
    }

    function renderTree() {
        if (!DATA) return;
        const svg = document.getElementById('tree-svg');
        const nodesLayer = document.getElementById('nodes-layer');
        const timelineMarks = document.getElementById('timeline-marks');
        const container = document.getElementById('main-container');
        
        svg.innerHTML = ''; nodesLayer.innerHTML = ''; timelineMarks.innerHTML = '';

        const width = container.offsetWidth;
        const cats = DATA.categories[currentGroup] || [];
        if (cats.length === 0) return;

        const colWidth = (width - 240) / cats.length;
        const rootX = width / 2;
        const lanePositions = cats.map((_, i) => 180 + (i * colWidth) + (colWidth / 2));

        // 1. 绘制时间轴刻度
        const latestYear = Math.max(...DATA.papers.map(p => p.year), ...(DATA.years || []));
        for (let yr = BASE_YEAR; yr <= latestYear; yr++) {
            const y_pos = getY(yr, 1);
            const marker = document.createElement('div');
            marker.className = "year-marker";
            marker.style.top = `${y_pos}px`;
            marker.innerHTML = `<span>${yr}</span>`;
            timelineMarks.appendChild(marker);
        }

        // 2. 绘制泳道/枝干
        cats.forEach((cat, i) => {
            const laneX = lanePositions[i];
            const color = `hsl(${220 + (i * (360/cats.length))}, 70%, 60%)`;
            
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            const bottomY = container.scrollHeight || 5000;
            path.setAttribute("d", `M ${rootX} 80 C ${rootX} 250, ${laneX} 150, ${laneX} 350 L ${laneX} ${bottomY}`);
            path.setAttribute("class", "branch-path");
            path.setAttribute("stroke", color);
            svg.appendChild(path);

            const header = document.createElement('div');
            header.className = "category-header";
            header.style.left = `${laneX}px`;
            header.style.top = `330px`;
            header.style.transform = "translateX(-50%)";
            header.style.color = color;
            header.textContent = cat;
            nodesLayer.appendChild(header);
        });

        // 3. 绘制节点
        DATA.papers.forEach(p => {
            const y = getY(p.year, p.month);
            const pVal = p[currentGroup];
            const targetIndices = Array.isArray(pVal) 
                ? pVal.map(v => cats.indexOf(v)) 
                : [cats.indexOf(pVal)];

            const validIndices = targetIndices.filter(i => i !== -1);
            
            // 多节点连线
            if (validIndices.length > 1) {
                const xs = validIndices.map(i => lanePositions[i]);
                const line = document.createElementNS("http://www.w3.org/2000/svg", "path");
                line.setAttribute("d", `M ${Math.min(...xs)} ${y} L ${Math.max(...xs)} ${y}`);
                line.setAttribute("class", "convergence-line");
                svg.appendChild(line);
            }

            validIndices.forEach(idx => {
                const group = document.createElement('div');
                group.className = "node-group";
                
                const node = document.createElement('div');
                node.className = "node-point";
                node.style.left = `${lanePositions[idx]}px`;
                node.style.top = `${y}px`;
                node.style.backgroundColor = `hsl(${220 + (idx * (360/cats.length))}, 70%, 60%)`;
                node.onclick = () => showDetail(p);
                
                const label = document.createElement('div');
                label.className = "node-label";
                label.style.left = `${lanePositions[idx]}px`;
                label.style.top = `${y}px`;
                label.textContent = p.name;
                
                group.appendChild(node); group.appendChild(label);
                nodesLayer.appendChild(group);
            });
        });
    }

    function showDetail(p) {
        document.getElementById('detail-modal').classList.remove('hidden');
        document.getElementById('modal-content').innerHTML = `
            <div class="flex flex-wrap items-center gap-4 mb-8">
                <span class="bg-indigo-500 text-white px-4 py-1.5 rounded-xl text-xs font-black tracking-widest">${p.year}.${p.month}</span>
                <span class="text-slate-800 text-xl">/</span>
                <span class="bg-slate-800 text-indigo-400 px-4 py-1.5 rounded-xl text-xs font-black uppercase tracking-widest">${p.base}</span>
                <span class="text-indigo-300 font-black uppercase text-xs tracking-widest ml-auto">${p.task}</span>
            </div>
            <h2 class="text-5xl font-black text-white mb-8 tracking-tighter leading-tight">${p.name}</h2>
            <p class="text-xl text-slate-400 mb-12 leading-relaxed font-light">${p.desc || "No description available."}</p>
            <div class="flex gap-4">
                <a href="${p.link}" target="_blank" class="flex-1 bg-white text-black py-5 rounded-3xl text-center font-black text-lg hover:bg-indigo-600 hover:text-white transition-all shadow-2xl">Arxiv Paper</a>
                <button onclick="closeModal()" class="px-10 border border-slate-800 text-slate-500 py-5 rounded-3xl font-bold hover:text-white transition-colors">Close</button>
            </div>
        `;
        if (window.lucide) lucide.createIcons();
    }

    function closeModal() { document.getElementById('detail-modal').classList.add('hidden'); }
    window.onload = init;
</script>
</body>
</html>
