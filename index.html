<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Video Universe - Evolution Survey</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050810; color: #e2e8f0; overflow-x: hidden; }
        .timeline-container { position: relative; background: radial-gradient(circle at top, #111827 0%, #050810 80%); border-radius: 3rem; border: 1px solid rgba(255, 255, 255, 0.03); margin-top: 2rem; min-height: 1400px; }
        .year-marker { position: absolute; left: 20px; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 800; color: #1e293b; display: flex; align-items: center; gap: 10px; width: 100px; }
        .year-marker::after { content: ''; flex-grow: 1; height: 1px; background: linear-gradient(to right, #1e293b, transparent); }
        .branch-path { fill: none; stroke-width: 2; stroke-linecap: round; opacity: 0.15; transition: opacity 0.4s; }
        .convergence-line { fill: none; stroke-width: 1.5; stroke-dasharray: 4 4; opacity: 0; transition: opacity 0.3s ease; }
        .node-point { width: 14px; height: 14px; border-radius: 50%; border: 3px solid #050810; position: absolute; transform: translate(-50%, -50%); z-index: 50; cursor: pointer; transition: all 0.3s; }
        .node-point:hover { transform: translate(-50%, -50%) scale(2.2); box-shadow: 0 0 30px currentColor; }
        .node-label { position: absolute; white-space: nowrap; font-size: 10px; font-weight: 900; text-transform: uppercase; color: #fff; background: rgba(15, 23, 42, 0.9); padding: 4px 10px; border-radius: 6px; pointer-events: none; opacity: 0; transform: translate(15px, -50%); transition: opacity 0.2s, transform 0.2s; border: 1px solid rgba(255,255,255,0.1); }
        .node-group:hover .node-label { opacity: 1; transform: translate(20px, -50%); }
        .category-header { position: absolute; text-align: center; font-weight: 800; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; padding: 8px 16px; border-radius: 99px; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        #loading { position: fixed; inset: 0; background: #050810; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; font-weight: 900; letter-spacing: 0.2em; }
    </style>
</head>
<body>

<div id="loading">
    <div class="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
    <span id="loading-text">INITIALIZING UNIVERSE...</span>
</div>

<div id="app" class="max-w-[1600px] mx-auto p-6 md:p-10 opacity-0 transition-opacity duration-700">
    <header class="mb-12 flex flex-col xl:flex-row justify-between items-start xl:items-end gap-8">
        <div>
            <h1 class="text-5xl font-black text-white tracking-tighter mb-2">Human Video <span class="text-indigo-500">Universe</span></h1>
            <p class="text-slate-400 max-w-xl text-base">Visualizing the convergence of multimodal priors.</p>
        </div>
        <div class="flex flex-wrap items-center gap-3 bg-slate-900/40 p-2 rounded-2xl border border-white/5 shadow-inner">
            <button onclick="updateGroupBy('mod')" id="btn-mod" class="px-6 py-2.5 rounded-xl text-xs font-bold transition">Modality</button>
            <button onclick="updateGroupBy('task')" id="btn-task" class="px-6 py-2.5 rounded-xl text-xs font-bold transition">Task</button>
            <button onclick="updateGroupBy('base')" id="btn-base" class="px-6 py-2.5 rounded-xl text-xs font-bold transition">Architecture</button>
        </div>
    </header>

    <div class="timeline-container relative overflow-hidden">
        <svg id="tree-svg" class="absolute inset-0 w-full h-full pointer-events-none"></svg>
        <div id="timeline-marks" class="absolute inset-0 pointer-events-none"></div>
        <div id="nodes-layer" class="absolute inset-0"></div>
    </div>
</div>

<div id="detail-modal" class="fixed inset-0 bg-slate-950/98 backdrop-blur-3xl hidden z-[100] flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-white/5 rounded-[3.5rem] max-w-3xl w-full p-12 relative shadow-2xl">
        <button onclick="closeModal()" class="absolute top-10 right-10 text-slate-500"><i data-lucide="x" class="w-10 h-10"></i></button>
        <div id="modal-content"></div>
    </div>
</div>

<script>
    // This is a copy of your list.json. The app will use this if list.json cannot be fetched (e.g., local file browsing).
    const LOCAL_FALLBACK_DATA = {
        "papers": [
            { "id": 1, "name": "Sora", "year": 2024, "month": 2, "mod": ["Text"], "task": "General", "base": "DiT", "desc": "Large-scale diffusion transformer for high-fidelity video generation.", "link": "#" },
            { "id": 2, "name": "AnimateAnyone", "year": 2023, "month": 11, "mod": ["Vision"], "task": "Animation", "base": "UNet", "desc": "Reference-Net based high-fidelity human animation.", "link": "#" },
            { "id": 3, "name": "MuseTalk", "year": 2024, "month": 4, "mod": ["Audio"], "task": "Talking Head", "base": "UNet", "desc": "Real-time lip-sync with localized facial refinement.", "link": "#" },
            { "id": 4, "name": "V-Express", "year": 2024, "month": 6, "mod": ["Audio", "Motion"], "task": "Talking Head", "base": "UNet", "desc": "A hybrid model balancing audio-sync and pose control.", "link": "#" },
            { "id": 5, "name": "Champ", "year": 2024, "month": 3, "mod": ["Motion"], "task": "Animation", "base": "UNet", "desc": "3D skeleton-guided motion synthesis.", "link": "#" },
            { "id": 16, "name": "V-Flow", "year": 2025, "month": 2, "mod": ["Text", "Motion", "Vision"], "task": "General", "base": "Flow Matching", "desc": "Next-gen multi-condition flow matching system.", "link": "#" },
            { "id": 17, "name": "LivePortrait", "year": 2024, "month": 10, "mod": ["Vision"], "task": "Talking Head", "base": "GAN", "desc": "Stitch-capable portrait animation.", "link": "#" },
            { "id": 18, "name": "EchoMimic", "year": 2024, "month": 7, "mod": ["Audio", "Motion"], "task": "Animation", "base": "UNet", "desc": "Synchronized facial and body motion from dual cues.", "link": "#" }
        ],
        "categories": {
            "mod": ["Vision", "Text", "Audio", "Motion"],
            "task": ["Animation", "Talking Head", "Virtual Try-on", "3D Generation", "Interactive Edit", "General"],
            "base": ["UNet", "DiT", "GAN", "Flow Matching", "Autoregressive"]
        },
        "years": [2023, 2024, 2025]
    };

    let DATA = null;
    let currentGroup = 'mod';
    const START_Y = 200; 
    const YEAR_HEIGHT = 450; 
    const BASE_YEAR = 2023;

    async function init() {
        const loadingText = document.getElementById('loading-text');
        try {
            loadingText.innerText = "FETCHING EXTERNAL JSON...";
            const response = await fetch('./list.json');
            
            if (!response.ok) throw new Error("File not found");
            
            DATA = await response.json();
            console.log("Loaded from list.json");
        } catch (error) {
            console.warn("CORS/Fetch error, using Local Fallback Data. Reason:", error.message);
            DATA = LOCAL_FALLBACK_DATA;
            loadingText.innerText = "LOCAL MODE ACTIVE";
        } finally {
            // Hide loader and render anyway
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('app').classList.remove('opacity-0');
                updateGroupBy('mod');
                if (window.lucide) lucide.createIcons();
                window.addEventListener('resize', () => renderTree());
            }, 500);
        }
    }

    // ... existing renderTree, updateGroupBy, and other functions ...
        return START_Y + ((year - BASE_YEAR) + (month - 1) / 12) * YEAR_HEIGHT;
    }

    function renderTree() {
        if (!DATA) return;
        const svg = document.getElementById('tree-svg');
        const nodesLayer = document.getElementById('nodes-layer');
        const timelineMarks = document.getElementById('timeline-marks');
        const container = document.querySelector('.timeline-container');
        
        svg.innerHTML = ''; nodesLayer.innerHTML = ''; timelineMarks.innerHTML = '';

        const width = container.offsetWidth;
        const cats = DATA.categories[currentGroup];
        const colWidth = (width - 180) / cats.length;
        const rootX = width / 2;
        const rootY = 50;

        DATA.years.forEach(year => {
            const y = getYCoordinate(year, 1);
            const marker = document.createElement('div');
            marker.className = "year-marker";
            marker.style.top = `${y}px`;
            marker.innerHTML = `<span>${year}</span>`;
            timelineMarks.appendChild(marker);
        });

        const lanePositions = cats.map((_, i) => 140 + (i * colWidth) + (colWidth / 2));

        cats.forEach((cat, i) => {
            const laneX = lanePositions[i];
            const color = `hsl(${210 + (i * (360/cats.length))}, 70%, 60%)`;
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", `M ${rootX} ${rootY} C ${rootX} 150, ${laneX} 100, ${laneX} 200 L ${laneX} 2000`);
            path.setAttribute("class", "branch-path");
            path.setAttribute("stroke", color);
            svg.appendChild(path);

            const header = document.createElement('div');
            header.className = "category-header";
            header.style.left = `${laneX}px`;
            header.style.top = `180px`;
            header.style.transform = "translateX(-50%)";
            header.style.color = color;
            header.textContent = cat;
            nodesLayer.appendChild(header);
        });

        DATA.papers.forEach(p => {
            const y = getYCoordinate(p.year, p.month);
            const pVal = p[currentGroup];
            const targetIndices = Array.isArray(pVal) ? pVal.map(v => cats.indexOf(v)) : [cats.indexOf(pVal)];

            if (targetIndices.length > 1) {
                const xs = targetIndices.map(i => lanePositions[i]);
                const line = document.createElementNS("http://www.w3.org/2000/svg", "path");
                line.setAttribute("d", `M ${Math.min(...xs)} ${y} L ${Math.max(...xs)} ${y}`);
                line.setAttribute("class", "convergence-line");
                line.setAttribute("stroke", "#4f46e5");
                line.dataset.pid = p.id;
                svg.appendChild(line);
            }

            targetIndices.forEach(idx => {
                if (idx === -1) return;
                const group = document.createElement('div');
                group.className = "node-group";
                group.onmouseenter = () => document.querySelectorAll(`.convergence-line[data-pid="${p.id}"]`).forEach(l => l.style.opacity = "0.8");
                group.onmouseleave = () => document.querySelectorAll(`.convergence-line[data-pid="${p.id}"]`).forEach(l => l.style.opacity = "0");

                const node = document.createElement('div');
                node.className = "node-point";
                node.style.left = `${lanePositions[idx]}px`;
                node.style.top = `${y}px`;
                node.style.backgroundColor = `hsl(${210 + (idx * (360/cats.length))}, 70%, 60%)`;
                node.onclick = () => showDetail(p);
                
                const label = document.createElement('div');
                label.className = "node-label";
                label.style.left = `${lanePositions[idx]}px`;
                label.style.top = `${y}px`;
                label.textContent = p.name;

                group.appendChild(node); group.appendChild(label);
                nodesLayer.appendChild(group);
            });
        });
    }

    function showDetail(p) {
        document.getElementById('detail-modal').classList.remove('hidden');
        document.getElementById('modal-content').innerHTML = `
            <h2 class="text-6xl font-black text-white mb-6">${p.name}</h2>
            <p class="text-xl text-slate-400 mb-8">${p.desc}</p>
            <a href="${p.link}" target="_blank" class="inline-block bg-white text-black px-8 py-4 rounded-2xl font-bold">Read Paper</a>
        `;
        lucide.createIcons();
    }

    function closeModal() { document.getElementById('detail-modal').classList.add('hidden'); }
    window.onload = init;
</script>
</body>
</html>
